<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle timer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f4;color:#1c1c1a;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
.wrap{width:100%;max-width:460px}
.card{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:1.5rem;margin-bottom:12px}
.section-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.time-inputs{display:flex;gap:8px;align-items:center}
.time-inputs input{flex:1;text-align:center;font-size:18px;font-weight:500;padding:6px 4px;border:1px solid #d4d4d0;border-radius:8px;background:#fff;color:#1c1c1a;outline:none}
.time-inputs input:focus{box-shadow:0 0 0 2px rgba(20,184,166,.35);border-color:#14b8a6}
.time-sep{font-size:20px;font-weight:500;color:#888;line-height:1}
.bm-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.bm-row select{flex:1;font-size:13px;padding:6px 8px;border:1px solid #d4d4d0;border-radius:8px;background:#fff;color:#1c1c1a;outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid #d4d4d0;border-radius:8px;background:#fff;color:#1c1c1a;font-size:13px;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:#f5f5f4}
.btn:active{transform:scale(.97)}
.btn-sm{padding:6px 8px;font-size:13px}
.btn-del{color:#dc2626;border-color:transparent;background:transparent;font-size:16px;width:28px;height:28px;padding:0;border-radius:6px}
.btn-del:hover{background:#fee2e2}
#ring-area{display:flex;flex-direction:column;align-items:center;padding:1rem 0}
#ring-arc {
  transform: scaleX(-1) translateX(-100%);
}
#ring-area.idle #ring-arc {
  stroke: #E5E5E5;
}
#ring-area.running #ring-arc {
  stroke: #14b8a6;
}
#ring-area.paused #ring-arc {
  stroke: #f59e0b;
}
.controls{display:flex;gap:16px;justify-content:center;margin-top:1.25rem}
.ctrl-btn{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;border:1px solid #d4d4d0;background:#fff;color:#666;cursor:pointer;transition:background .15s,transform .1s}
.ctrl-btn:hover{background:#f5f5f4;color:#1c1c1a}
.ctrl-btn:active{transform:scale(.96)}
.ctrl-btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.ctrl-btn-start{background:#0f766e;color:#ccfbf1;border-color:#0f766e}
.ctrl-btn-start:hover{background:#115e59;color:#ccfbf1}
.bm-hint{font-size:11px;color:#aaa;margin-top:5px;min-height:16px}
h1{font-size:18px;font-weight:500;margin-bottom:1rem;color:#1c1c1a}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="section-label">Интервал</div>
    <div class="time-inputs">
      <input type="number" id="inp-h" min="0" max="99" value="0" placeholder="чч">
      <span class="time-sep">:</span>
      <input type="number" id="inp-m" min="0" max="59" value="0" placeholder="мм">
      <span class="time-sep">:</span>
      <input type="number" id="inp-s" min="0" max="59" value="30" placeholder="сс">
    </div>
    <div class="bm-row">
      <select id="bm-select"><option value="">— закладки —</option></select>
      <button class="btn btn-sm" id="bm-save">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2h10a1 1 0 0 1 1 1v11l-6-3-6 3V3a1 1 0 0 1 1-1z"/></svg>
      </button>
      <button class="btn btn-sm btn-del" id="bm-del" title="Удалить закладку">✕</button>
    </div>
    <div class="bm-hint" id="bm-hint"></div>
  </div>

  <div class="card">
    <div style="text-align:center">
      <div style="color:#aaa;margin-top:4px" id="interval-display">—</div>
    </div>
    <div id="ring-area" class="idle">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="90" fill="none" stroke="#e5e5e5" stroke-width="10"/>
        <path id="ring-arc" fill="none" stroke="#14b8a6" stroke-width="10" stroke-linecap="round"/>
        <text id="ring-text" x="110" y="95" text-anchor="middle" dominant-baseline="middle"
          font-size="40" font-weight="500" fill="#1c1c1a" font-family="system-ui,sans-serif">00:30</text>
        <text id="ring-sub" x="110" y="158" font-size="40" fill="#14b8a6" text-anchor="middle" font-family="system-ui,sans-serif"></text>
      </svg>
    </div>

    <div class="controls">
      <button class="ctrl-btn ctrl-btn-start" id="btn-start" title="Пуск">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.5l11 6.5-11 6.5z"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="btn-pause" title="Пауза" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="5" width="4" height="14" rx="1.5"/>
          <rect x="14" y="5" width="4" height="14" rx="1.5"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="btn-reset" title="Сброс">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.5 12a6.5 6.5 0 1 0 1.3-3.9"/>
          <path d="M5.5 5.5V9H9"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const CX=110,CY=110,R=90;
function arcPath(deg){
  if(deg<=0)return'';
  if(deg>=360)return`M ${CX} ${CY-R} A ${R} ${R} 0 1 1 ${CX-0.001} ${CY-R} Z`;
  const rad=(deg-90)*Math.PI/180;
  const ex=CX+R*Math.cos(rad),ey=CY+R*Math.sin(rad);
  return`M ${CX} ${CY-R} A ${R} ${R} 0 ${deg>180?1:0} 1 ${ex} ${ey}`;
}

let totalSec=30,remSec=30,cycle=1,running=false,paused=false,timer=null,lastTick=null;
let bookmarks=[];
const STORAGE_KEY='cyclic-timer-bookmarks';

const $=id=>document.getElementById(id);
const inpH=$('inp-h'),inpM=$('inp-m'),inpS=$('inp-s');
const ringArea=$('ring-area');
const arcEl=$('ring-arc'),ringTxt=$('ring-text'),ringSub=$('ring-sub');
const intDisp=$('interval-display');
const btnStart=$('btn-start'),btnPause=$('btn-pause'),btnReset=$('btn-reset');
const bmSel=$('bm-select'),bmSave=$('bm-save'),bmDel=$('bm-del'),bmHint=$('bm-hint');

function pad(n){return String(n).padStart(2,'0')}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?`${pad(h)}:${pad(m)}:${pad(ss)}`:`${pad(m)}:${pad(ss)}`}
function getInput(){return(+inpH.value||0)*3600+(+inpM.value||0)*60+(+inpS.value||0)}
function setInputFromSec(sec){inpH.value=Math.floor(sec/3600);inpM.value=Math.floor((sec%3600)/60);inpS.value=sec%60}

function updateRing(sec,total){
  const pct=total>0?sec/total:1;
  arcEl.setAttribute('d',arcPath(pct*360));
  ringTxt.textContent=fmtTime(sec);
}
function setStatus(state){
  ringArea.className=state;
}

function setCycle(v) {
  cycle=v;
  ringSub.textContent=cycle;
}

function incCycle() {
  setCycle(cycle+1);
}

function renderBookmarks(){
  const cur=bmSel.value;
  while(bmSel.options.length>1)bmSel.remove(1);
  bookmarks.forEach(b=>{
    const opt=document.createElement('option');
    opt.value=b.sec;opt.textContent=fmtTime(b.sec);
    bmSel.appendChild(opt);
  });
  if(bookmarks.find(b=>String(b.sec)===cur))bmSel.value=cur;
  bmHint.textContent=bookmarks.length?`Сохранено закладок: ${bookmarks.length}`:'';
}
function loadBookmarks(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){bookmarks=JSON.parse(raw);renderBookmarks();}
  }catch(e){bookmarks=[];}
}
function saveBookmarks(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(bookmarks));}catch(e){}
}
function addBookmark(){
  const sec=getInput();if(sec<=0)return;
  if(bookmarks.find(b=>b.sec===sec))return;
  bookmarks.push({sec});bookmarks.sort((a,b)=>a.sec-b.sec);
  renderBookmarks();saveBookmarks();
  bmHint.textContent=`Закладка ${fmtTime(sec)} сохранена`;
  setTimeout(()=>{bmHint.textContent=`Сохранено закладок: ${bookmarks.length}`},1500);
}
function deleteBookmark(){
  const v=+bmSel.value;if(!v)return;
  bookmarks=bookmarks.filter(b=>b.sec!==v);
  renderBookmarks();saveBookmarks();
}

function beep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,150,300].forEach(delay=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;o.type='sine';
      g.gain.setValueAtTime(0,ctx.currentTime+delay/1000);
      g.gain.linearRampToValueAtTime(.4,ctx.currentTime+delay/1000+.01);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay/1000+.18);
      o.start(ctx.currentTime+delay/1000);o.stop(ctx.currentTime+delay/1000+.2);
    });
  }catch(e){}
}

function tick(){
  const now=Date.now();
  const delta=Math.round((now-lastTick)/1000);
  if(delta<1)return;
  lastTick=now-(now-lastTick-delta*1000);
  remSec=Math.max(0,remSec-delta);
  updateRing(remSec,totalSec);
  if(remSec<=0){
    incCycle();
    beep();remSec=totalSec;
    updateRing(remSec,totalSec);
  }
}

function start(){
  const t=getInput();if(t<=0){inpS.focus();return}
  if(!paused){totalSec=t;remSec=t;intDisp.textContent=fmtTime(t)}
  running=true;paused=false;
  lastTick=Date.now();
  timer=setInterval(tick,100);
  updateRing(remSec,totalSec);
  setStatus('running');
  btnStart.disabled=true;btnPause.disabled=false;
  [inpH,inpM,inpS].forEach(i=>i.disabled=true);
}
function pause(){
  if(!running)return;
  running=false;paused=true;clearInterval(timer);
  setStatus('paused');
  btnStart.disabled=false;btnPause.disabled=true;
}
function reset(){
  running=false;paused=false;clearInterval(timer);
  setCycle(1);
  const t=getInput();totalSec=t;remSec=t;
  updateRing(t,t);
  intDisp.textContent='—';setStatus('idle');
  btnStart.disabled=false;btnPause.disabled=true;
  [inpH,inpM,inpS].forEach(i=>i.disabled=false);
}

bmSave.addEventListener('click',addBookmark);
bmDel.addEventListener('click',deleteBookmark);
bmSel.addEventListener('change',()=>{
  const v=+bmSel.value;if(!v)return;
  setInputFromSec(v);
  if(!running&&!paused){remSec=v;totalSec=v;updateRing(v,v);}
});
btnStart.addEventListener('click',start);
btnPause.addEventListener('click',pause);
btnReset.addEventListener('click',reset);
[inpH,inpM,inpS].forEach(inp=>{
  inp.addEventListener('change',()=>{
    if(!running&&!paused){const t=getInput();remSec=t;totalSec=t;updateRing(t,t);}
  });
});

function init() {
  updateRing(30,30);
  loadBookmarks();
  setCycle(1);
}
init();
</script>
</body>
</html>
